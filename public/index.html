<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render Agent</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--border:#2a313b;--text:#e6edf3;--muted:#8b949e;--accent:#46e3b7;--warn:#f0b429;--err:#ff6b6b;--user:#1f2a3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .meta{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  select,input,button,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  button{cursor:pointer;background:var(--accent);color:#04211a;border:none;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:960px;width:100%;margin:0 auto}
  .msg{padding:10px 14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .user{background:var(--user);align-self:flex-end;max-width:80%}
  .assistant{background:var(--panel);border:1px solid var(--border)}
  .assistant table{border-collapse:collapse;margin:6px 0}
  .assistant td,.assistant th{border:1px solid var(--border);padding:3px 8px;text-align:left}
  .assistant code{background:#0b0e13;padding:1px 4px;border-radius:4px}
  .step{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);padding:4px 10px;border-left:2px solid var(--border)}
  .step.call{color:#79c0ff}.step.denied{color:var(--warn)}.step.error{color:var(--err)}.step.thought{font-style:italic}
  .step .risk{font-size:10px;padding:0 4px;border-radius:3px;border:1px solid currentColor;margin-left:6px}
  footer{padding:12px 16px;border-top:1px solid var(--border);background:var(--panel)}
  form{display:flex;gap:8px;max-width:960px;margin:0 auto}
  textarea{flex:1;resize:none;min-height:44px;max-height:160px}
  .hint{color:var(--muted);font-size:12px;max-width:960px;margin:6px auto 0}
  #gate{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
  #gate div{background:var(--panel);padding:24px;border-radius:12px;border:1px solid var(--border);width:340px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<header>
  <h1>⚙️ Render Agent</h1>
  <span class="meta" id="model">connecting…</span>
  <span class="spacer"></span>
  <label class="meta">mode <select id="mode"><option value="read-only">read-only</option><option value="safe" selected>safe</option><option value="auto">auto</option></select></label>
  <button id="reset" type="button" style="background:var(--border);color:var(--text)">New session</button>
</header>
<main id="log"></main>
<footer>
  <form id="form">
    <textarea id="input" placeholder="e.g. Why is the api service failing? Roll back to the last good deploy if it is." required></textarea>
    <button id="send" type="submit">Run</button>
  </form>
  <div class="hint">Enter to send, Shift+Enter for a newline. <b>safe</b> can deploy, roll back, scale and edit env vars; <b>auto</b> can also suspend and delete.</div>
</footer>
<div id="gate"><div><b>Access token</b><input id="token" type="password" placeholder="AGENT_ACCESS_TOKEN"><button id="tokenOk" type="button">Continue</button></div></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), form = $('form'), input = $('input'), sendBtn = $('send'), modeSel = $('mode');
  let token = localStorage.getItem('render-agent-token') || '';
  let sessionId = sessionStorage.getItem('render-agent-session') || '';

  const headers = () => ({ 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) });
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  // Tiny markdown: code, bold, tables, links. Enough for status reports.
  function md(text) {
    const lines = text.split('\n'); const out = []; let i = 0;
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    while (i < lines.length) {
      if (/^\s*\|.*\|\s*$/.test(lines[i]) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
        const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
        let html = '<table><tr>' + cells(lines[i]).map((c) => '<th>' + c + '</th>').join('') + '</tr>';
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += '<tr>' + cells(lines[i]).map((c) => '<td>' + c + '</td>').join('') + '</tr>'; i++; }
        out.push(html + '</table>');
      } else { out.push(inline(lines[i])); i++; }
    }
    return out.join('\n');
  }

  function add(cls, html, plain) {
    const el = document.createElement('div');
    el.className = cls;
    if (plain) el.textContent = html; else el.innerHTML = html;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function loadConfig() {
    const r = await fetch('/api/config', { headers: headers() });
    if (r.status === 401) { $('gate').style.display = 'flex'; return false; }
    const c = await r.json();
    $('model').textContent = c.model + ' · max mode ' + c.maxMode;
    for (const o of modeSel.options) o.disabled = ({ 'read-only': 0, safe: 1, auto: 2 }[o.value] > { 'read-only': 0, safe: 1, auto: 2 }[c.maxMode]);
    if (modeSel.selectedOptions[0].disabled) modeSel.value = c.maxMode;
    return true;
  }

  $('tokenOk').onclick = async () => {
    token = $('token').value.trim();
    localStorage.setItem('render-agent-token', token);
    if (await loadConfig()) $('gate').style.display = 'none';
  };

  $('reset').onclick = async () => {
    if (sessionId) await fetch('/api/session?id=' + encodeURIComponent(sessionId), { method: 'DELETE', headers: headers() });
    sessionId = ''; sessionStorage.removeItem('render-agent-session'); log.innerHTML = '';
  };

  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const message = input.value.trim(); if (!message) return;
    input.value = ''; sendBtn.disabled = true;
    add('msg user', message, true);
    let current = null;
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: headers(), body: JSON.stringify({ message, sessionId, mode: modeSel.value }) });
      if (!r.ok) { add('step error', 'Error: ' + ((await r.json()).error || r.status), true); return; }
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          if (!chunk.startsWith('data: ')) continue;
          const ev = JSON.parse(chunk.slice(6));
          if (ev.type === 'session') { sessionId = ev.sessionId; sessionStorage.setItem('render-agent-session', sessionId); }
          else if (ev.type === 'thought') add('step thought', ev.content, true);
          else if (ev.type === 'tool_call') current = add('step call', '→ ' + esc(ev.name) + ' <span class="risk">' + esc(ev.risk || '?') + '</span> ' + esc(JSON.stringify(ev.args)));
          else if (ev.type === 'tool_result') add('step', '  ✓ ' + ev.preview.replace(/\s+/g, ' ').slice(0, 200), true);
          else if (ev.type === 'tool_denied') add('step denied', '  ✗ denied by policy (' + ev.risk + ')', true);
          else if (ev.type === 'tool_error') add('step error', '  ✗ ' + ev.error, true);
          else if (ev.type === 'assistant') add('msg assistant', md(ev.content || ''));
          else if (ev.type === 'error') add('step error', 'Error: ' + ev.error, true);
        }
      }
    } catch (err) { add('step error', 'Network error: ' + err.message, true); }
    finally { sendBtn.disabled = false; input.focus(); }
  };

  loadConfig();
})();
</script>
</body>
</html>
